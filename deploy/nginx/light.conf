# 心灯 Nginx 反代（deploy/nginx/light.conf）
# web(/) 与 admin(/admin/) 静态资源 + API 反代；HTTPS 证书由部署方放入 nginx/certs。

# ---- HTTP → HTTPS（未配置证书时可临时注释掉 443 段并放开下行）----
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- 主站（/web）----
server {
    listen 443 ssl;
    http2 on;
    server_name light.example.com;   # 上线前人工确认域名

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
    }
}

# ---- 后台（/admin/）----
server {
    listen 443 ssl;
    http2 on;
    server_name admin.light.example.com;   # 上线前人工确认域名；建议叠加 IP 白名单

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://admin:80;
        proxy_set_header Host $host;
    }
}

# ---- API（两个前端共用 /api 前缀；部署时也可以用独立 api 域名）----
server {
    listen 443 ssl;
    http2 on;
    server_name api.light.example.com;   # 上线前人工确认域名

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header X-Content-Type-Options nosniff always;

    # 限流兜底（应用层已有 RateLimiter；此处做连接级防护）
    location / {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
